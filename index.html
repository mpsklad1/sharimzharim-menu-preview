<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Меню #ШаримЖарим: бургеры, шаверма, курица гриль и закуски.">
  <title>#ШаримЖарим · Меню</title>
  <script>
    if (location.protocol === "http:" && /^(www\.)?sharimzharim\.pro$/.test(location.hostname)) {
      location.replace(`https://mpsklad1.github.io/sharimzharim-menu-preview/${location.search}${location.hash}`);
    }
  </script>
  <link rel="icon" type="image/png" href="./assets/icon.png">
  <link rel="stylesheet" href="./style.css?v=20261008-password-auth">
  <link rel="stylesheet" href="./reviews.css?v=20261008-password-auth">
  <link rel="stylesheet" href="./builder.css?v=20261010-builder">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="./app.js?v=20261010-builder"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-row">
        <div>
          <div class="brand-name">#ШаримЖарим</div>
          <div class="brand-caption">МЕНЮ <span aria-hidden="true">·</span> ДЕМО</div>
        </div>
        <button class="icon-button header-cart" id="header-cart" type="button" aria-label="Открыть корзину">
          <span class="icon icon-bag" aria-hidden="true"></span>
          <span class="cart-count" id="header-cart-count" hidden></span>
        </button>
      </div>
      <label class="search-field">
        <span class="icon icon-search" aria-hidden="true"></span>
        <input id="menu-search" type="search" placeholder="Найти в меню" autocomplete="off" aria-label="Найти в меню">
      </label>
      <nav class="category-list" id="category-list" aria-label="Категории меню"></nav>
    </header>

    <main class="catalog">
      <button class="account-link" id="account-link" type="button"><span id="account-link-label">Личный кабинет</span><span class="icon icon-promo-arrow" aria-hidden="true"></span></button>
      <a class="game-promo" id="game-promo" href="./game/" aria-label="Поймай скидку — открыть игру">
        <span class="game-promo-copy">
          <span class="game-promo-kicker">ИГРА #ШАРИМЖАРИМ</span>
          <strong>Поймай скидку</strong>
        </span>
        <img class="game-promo-image" src="./assets/game-burger.png" alt="" width="512" height="512">
        <span class="icon icon-promo-arrow" aria-hidden="true"></span>
      </a>
      <section class="builder-entry" id="builder-entry" aria-label="Приготовь по своему вкусу" hidden>
        <div class="builder-entry-heading"><span>Собери по своему вкусу</span><span>НОВОЕ</span></div>
        <div class="builder-entry-cards">
          <button type="button" data-build-meal="burger"><strong>Приготовь<br>бургер</strong><svg viewBox="0 0 100 90" aria-hidden="true"><path d="M9 38Q12 5 50 5t41 33Z" fill="#e8a14c"/><path d="m27 20 4-2m15-6 4 2m19 4 4 2" stroke="#ffe8af" stroke-width="3" stroke-linecap="round"/><path d="M10 46q8-7 17 0t18 0 18 0 18 0l9 1v9H10Z" fill="#77a94f"/><rect x="8" y="56" width="84" height="12" rx="6" fill="#8d4c2f"/><path d="m10 51 80 1-13 11-30-8-19 9Z" fill="#ffc640"/><path d="M10 72h80q-4 15-40 15T10 72Z" fill="#e8a14c"/></svg><span class="icon icon-promo-arrow" aria-hidden="true"></span></button>
          <button type="button" data-build-meal="shawarma"><strong>Приготовь<br>шаурму</strong><svg viewBox="0 0 100 90" aria-hidden="true"><g transform="rotate(14 50 45)"><path d="M20 14q30-14 60 0l-7 66q-23 13-46 0Z" fill="#e8b97c"/><path d="m25 15 50-1-4 11H29Z" fill="#77a94f"/><path d="m29 22 44-2-5 10H31Z" fill="#e35c40"/><path d="m31 28 38-3-6 15H32Z" fill="#bd7f3e"/><path d="m21 34 53 17-3 30q-21 13-44-1Z" fill="#f4d49d"/><path d="m31 52 36 13m-33-3 32 12" stroke="#c18b50" stroke-width="3" stroke-linecap="round"/></g></svg><span class="icon icon-promo-arrow" aria-hidden="true"></span></button>
        </div>
      </section>
      <div id="menu-sections"></div>
      <p class="catalog-note">Цены и оформление заказа показаны для демо.</p>
    </main>
  </div>

  <button class="cart-bar" id="cart-bar" type="button" hidden>
    <span class="cart-bar-label"><span class="icon icon-bag" aria-hidden="true"></span><span id="cart-bar-count"></span></span>
    <span id="cart-bar-total"></span>
  </button>

  <dialog class="sheet" id="product-dialog" aria-label="Состав блюда"></dialog>
  <dialog class="sheet" id="reviews-dialog" aria-label="Оценки и отзывы"></dialog>
  <dialog class="sheet" id="cart-dialog" aria-label="Корзина"></dialog>
  <dialog class="sheet" id="account-dialog" aria-label="Мой аккаунт"></dialog>
  <dialog class="sheet builder-dialog" id="builder-dialog" aria-label="Приготовь по своему вкусу"></dialog>
  <section class="game-view" id="game-view" aria-label="Игра Поймай скидку" hidden>
    <header class="game-view-header">
      <button class="game-view-back" id="game-back" type="button" aria-label="Вернуться в меню" title="Вернуться в меню"><span class="icon icon-back" aria-hidden="true"></span></button>
      <strong>Поймай скидку</strong>
    </header>
    <iframe id="game-frame" title="Игра Поймай скидку" allow="camera; accelerometer; gyroscope" referrerpolicy="no-referrer"></iframe>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
